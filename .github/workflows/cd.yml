name: CD - Build & Release App

on:
  push:
    branches: [ main ]  # Triggers ONLY when merged to main

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # --- WINDOWS BUILD ---
    - name: Build Windows Executable
      if: matrix.os == 'windows-latest'
      run: pyinstaller --noconfirm --onefile --windowed --name "NetraOCR" --add-data "src;src" src/app.py

    # --- MACOS BUILD ---
    - name: Build macOS App Bundle
      if: matrix.os == 'macos-latest'
      run: |
        pyinstaller netra_ocr.spec --clean
        cd dist && zip -r NetraOCR-macOS.app.zip NetraOCR.app

    # --- LINUX BUILD ---
    - name: Build Linux Executable
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libglib2.0-0 libxrender1 libxext6
        pyinstaller --noconfirm --onefile --windowed --name "NetraOCR" --add-data "src:src" src/app.py

    # --- UPLOAD ARTIFACTS ---
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: NetraOCR-${{ matrix.os }}
        path: dist/

  # --- CREATE GITHUB RELEASE ---
  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: artifacts/

    - name: Create "Latest Build" Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: latest-build-${{ github.sha }}
        name: "Latest Continuous Build (${{ github.sha }})"
        body: |
          Automated build triggered by merge to main.
          Commit: ${{ github.event.head_commit.message }}
        files: artifacts/**/*
        draft: false
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}