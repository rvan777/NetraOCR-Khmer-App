name: CD - Build & Release App

on:
  push:
    tags:
      - 'v*' # Trigger on version tag like v1.0.0

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --- WINDOWS BUILD ---
      - name: Build with PyInstaller (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller netra_ocr.spec --clean
          cd dist
          # Zip the exe file directly
          powershell Compress-Archive -Path NetraOCR.exe -DestinationPath NetraOCR-Windows.zip

      # --- macOS BUILD ---
      - name: Build with PyInstaller (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          pyinstaller netra_ocr.spec --clean
          # Zip the .app bundle for distribution
          cd dist && zip -r NetraOCR-macOS.app.zip NetraOCR.app

      # --- Linux BUILD ---
      - name: Build with PyInstaller (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libxrender1 libxext6
          pyinstaller netra_ocr.spec --clean
          cd dist && tar -czf NetraOCR-Linux.tar.gz NetraOCR

      # --- UPLOAD ARTIFACTS ---
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NetraOCR-${{ matrix.os }}
          path: dist/
          retention-days: 1

  # --- CREATE GITHUB RELEASE ---
  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Wait before uploading release assets
        run: sleep 120  # Wait 60 seconds to allow artifact propagation

      - name: Create "Latest Build" Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build-${{ github.sha }}
          name: "Latest Continuous Build (${{ github.sha }})"
          body: |
            Automated build triggered by merge to main.
            Commit: ${{ github.event.head_commit.message }}
          files: artifacts/**/*
          draft: false
          prerelease: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}